[project]
name = "immo-agent"
version = "0.1.0"
description = "Buyer's edge platform for the Flemish housing market"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "argon2-cffi>=23.1",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "selectolax>=1.0",
  "apscheduler>=3.10,<4",
  "scikit-learn>=1.5",
  "numpy>=1.26",
  "pillow>=10.4",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
browser = ["playwright>=1.45"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
immo = "immo_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["immo_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["immo_agent"]
omit = ["immo_agent/migrations/*"]

[tool.ruff]
line-length = 130
target-version = "py312"
exclude = ["immo_agent/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
