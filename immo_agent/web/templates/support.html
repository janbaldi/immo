{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Help</h1>
<div class="space-y-2 mb-6">{% for q, a in faq %}
  <details class="bg-white border rounded p-3"><summary class="font-semibold cursor-pointer">{{ q }}</summary><p class="text-sm mt-2">{{ a }}</p></details>{% endfor %}
</div>
{% if sent %}<p class="bg-green-50 text-green-800 p-2 rounded mb-3">Thanks, your question was sent. We answer by e-mail.</p>{% endif %}
<form method="post" action="/support" class="bg-white border rounded-xl p-4 space-y-2 text-sm">
  <h2 class="font-semibold">Ask a question</h2>
  <input name="subject" required placeholder="Subject" class="w-full border rounded p-2">
  <textarea name="body" required rows="4" placeholder="Your question" class="w-full border rounded p-2"></textarea>
  <button class="bg-indigo-600 text-white rounded px-3 py-1">Send</button>
</form>
{% endblock %}
