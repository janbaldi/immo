# Laptop:  docker compose up -d          -> http://localhost:8000
# VPS:     docker compose --profile vps up -d   (adds Caddy with automatic HTTPS for $DOMAIN)
x-app: &app
  build: .
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://immo:immo@db:5432/immo
  volumes:
    - appdata:/app/data
    - ./config:/app/config
    - ./reports:/app/reports
    - ./tests/fixtures/recorded:/app/tests/fixtures/recorded
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: immo
      POSTGRES_PASSWORD: immo
      POSTGRES_DB: immo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immo"]
      interval: 5s
      retries: 20

  web:
    <<: *app
    command: sh -c "immo init && immo web"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 30

  worker:
    <<: *app
    command: immo worker
    depends_on:
      web:
        condition: service_healthy

  # Test mailbox for automated tests and trying things out (http://localhost:8025).
  # Real alerts use the SMTP provider in .env.
  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"

  caddy:
    image: caddy:2
    profiles: ["vps"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy:/data
    depends_on:
      - web

volumes:
  pgdata:
  appdata:
  caddy:
