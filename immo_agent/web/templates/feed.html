{% extends "base.html" %}
{% block content %}
<div class="flex flex-wrap items-center justify-between mb-4 gap-2">
  <h1 class="text-2xl font-bold">Live feed</h1>
  <form method="get" class="text-sm">
    <select name="profile" onchange="this.form.submit()" class="border rounded p-1">
      <option value="">All my searches</option>
      {% for pr in user.profiles if pr.active %}<option value="{{ pr.id }}" {{ 'selected' if profile == pr.id }}>{{ pr.name }}</option>{% endfor %}
    </select>
  </form>
</div>
<p class="text-xs text-slate-500 mb-3">Newest first. Refreshes every minute.</p>
<div id="cards" class="space-y-3" hx-get="/feed/items{{ '?profile=%d'|format(profile) if profile }}" hx-trigger="every 60s" hx-swap="innerHTML">
  {% include "_cards.html" %}
</div>
{% endblock %}
